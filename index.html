<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的名片</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 40px 15px; }
        .card { background: white; border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
        .photo-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        .photo-row img { width: 48%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; }
        h1 { margin: 8px 0 4px; font-size: 22px; }
        .intro { color: #333; font-size: 15px; line-height: 1.7; text-align: left; margin-bottom: 24px; }
        .contact { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #007aff; }
        .contact a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="photo-row">
            <img src="./photo1.jpg" alt="照片1">
            <img src="./photo2.jpg" alt="照片2">
        </div>
        <h1>周富明</h1>
        <div class="intro">
            您好！我目前从事医疗工作，如果图片内容能帮助到您，请随时致电。
        </div>
        <div class="contact">
            <a href=" ">📧 13640123288@qq.com</a >
            <a href="tel:13640123288">📱 13640123288</a >
        </div>
    </div>
</body>
</html>
